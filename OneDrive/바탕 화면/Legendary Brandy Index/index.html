<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legendary Brandy Index — 글로벌 브랜디·코냑 시세</title>
<meta name="description" content="2주 주기로 글로벌 브랜디·코냑 시세 변동을 보여주는 트래커.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060606">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #060606;
    --bg-alt: #0f0d0a;
    --card-bg: rgba(20, 18, 15, 0.85);
    --card-border: rgba(212, 175, 55, 0.22);
    --gold: #d4af37;
    --gold-bright: #f0d98a;
    --gold-grad: linear-gradient(135deg, #f9f0d0 0%, #d4af37 50%, #8a6513 100%);
    --text: #f3efe6;
    --text-muted: #958c80;
    --up: #3ecf6e;
    --down: #ff5c5c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 55%);
    color: var(--text);
    font-family: "Noto Serif KR", "Apple SD Gothic Neo", serif, system-ui;
    min-height: 100vh;
  }

  a { color: inherit; }

  .gold-text {
    background: var(--gold-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(6, 6, 6, 0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
  }

  .top-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .brand {
    font-weight: 800;
    letter-spacing: 0.02em;
    font-size: 1.05rem;
    white-space: nowrap;
  }

  .top-links {
    display: flex;
    gap: 1.2rem;
    align-items: center;
    font-size: 0.85rem;
  }

  .top-links a.contact-link {
    color: var(--text-muted);
  }

  .top-links a.contact-link:hover { color: var(--gold-bright); }

  /* Ticker */
  .ticker-wrap {
    overflow: hidden;
    border-bottom: 1px solid var(--card-border);
    background: var(--bg-alt);
    white-space: nowrap;
  }

  .ticker {
    display: inline-flex;
    gap: 2.5rem;
    padding: 0.6rem 0;
    animation: scroll-ticker 32s linear infinite;
  }

  .ticker span.item {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .ticker span.item strong { color: var(--text); margin-right: 0.4rem; }

  .ticker .up { color: var(--up); }
  .ticker .down { color: var(--down); }

  @keyframes scroll-ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .page-title {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .page-title h1 {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
  }

  .page-title p {
    color: var(--text-muted);
    font-size: 0.92rem;
  }

  /* Market overview */
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .overview .stat {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 1.1rem 1.3rem;
    text-align: center;
  }

  .overview .stat .label {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }

  .overview .stat .value {
    font-size: 1.4rem;
    font-weight: 700;
  }

  .overview .stat .value.up { color: var(--up); }
  .overview .stat .value.down { color: var(--down); }

  /* Price grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.4rem;
    backdrop-filter: blur(8px);
    transition: border-color 0.3s ease;
  }

  .card .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.3rem;
  }

  .card .name { font-weight: 700; font-size: 1.05rem; }

  .card .category {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.9rem;
  }

  .card .price-row {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.3rem;
  }

  .card .price-usd {
    font-size: 1.5rem;
    font-weight: 800;
  }

  .card .price-krw {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .card .change {
    font-size: 0.88rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }

  .card .change.up { color: var(--up); }
  .card .change.down { color: var(--down); }

  .card .change-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 0.3rem;
  }

  .sparkline {
    margin-top: 1rem;
    height: 36px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }

  .sparkline .bar {
    flex: 1;
    background: var(--gold);
    opacity: 0.35;
    border-radius: 2px 2px 0 0;
    min-height: 3px;
    transition: height 0.4s ease;
  }

  .sparkline .bar:last-child { opacity: 0.9; }

  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    color: var(--text-muted);
    font-size: 0.78rem;
    border-top: 1px solid var(--card-border);
  }

  footer a { color: var(--gold); }

  @media (max-width: 600px) {
    .top-inner { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <span class="brand gold-text">Legendary Brandy Index</span>
    <nav class="top-links">
      <a href="landing.html">소개</a>
      <a href="contact.html" class="contact-link">문의하기</a>
    </nav>
  </div>
  <div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
  </div>
</header>

<main>
  <div class="page-title">
    <h1 class="gold-text">글로벌 브랜디·코냑 시세</h1>
    <p>2주(격주) 주기 기준 변동 &mdash; 표기가는 추정 참고가입니다.</p>
    <p id="updatedAt" style="margin-top:0.4rem;font-size:0.78rem;"></p>
  </div>

  <section class="overview" id="overview"></section>

  <section class="grid" id="grid"></section>
</main>

<footer>
  <p>
    표기 시세는 글로벌 리테일·옥션·2차 거래 공개 자료를 종합한 추정 참고가이며 투자·매매 권유가 아닙니다.<br>
    환율 1 USD = 1,390 KRW 고정 적용 · 비즈니스 제휴 문의는 <a href="contact.html">여기</a>로 남겨주세요.
  </p>
</footer>

<script>
  const USD_KRW_RATE = 1390;
  const API_URL = '/.netlify/functions/prices';
  const POLL_INTERVAL_MS = 60000;

  // Fallback seed so the page still renders when opened without the
  // Netlify Functions API available (e.g. plain file:// or npx serve).
  let brandyData = [
    { id: 'hennessy-xo', name: 'Hennessy XO', category: 'Cognac', price: 285, twoWeeksAgoPrice: 279, history: [268, 272, 271, 276, 279, 285] },
    { id: 'remy-xo', name: 'Rémy Martin XO', category: 'Cognac', price: 245, twoWeeksAgoPrice: 251, history: [258, 254, 256, 250, 251, 245] },
    { id: 'martell-cordon-bleu', name: 'Martell Cordon Bleu', category: 'Cognac', price: 195, twoWeeksAgoPrice: 189, history: [180, 183, 185, 188, 189, 195] },
    { id: 'courvoisier-xo', name: 'Courvoisier XO', category: 'Cognac', price: 210, twoWeeksAgoPrice: 214, history: [220, 218, 216, 213, 214, 210] },
    { id: 'camus-xo', name: 'Camus XO', category: 'Cognac', price: 175, twoWeeksAgoPrice: 168, history: [160, 162, 165, 166, 168, 175] },
    { id: 'louis-xiii', name: 'Louis XIII', category: 'Cognac', price: 3850, twoWeeksAgoPrice: 3790, history: [3700, 3720, 3760, 3780, 3790, 3850] },
    { id: 'hennessy-paradis', name: 'Hennessy Paradis', category: 'Cognac', price: 780, twoWeeksAgoPrice: 805, history: [830, 820, 812, 808, 805, 780] },
    { id: 'remy-1738', name: 'Rémy Martin 1738', category: 'Cognac', price: 68, twoWeeksAgoPrice: 65, history: [61, 62, 63, 64, 65, 68] },
    { id: 'dusse-vsop', name: "D'USSE VSOP", category: 'Cognac', price: 45, twoWeeksAgoPrice: 46, history: [48, 47, 47, 46, 46, 45] },
    { id: 'pierre-ferrand-1840', name: 'Pierre Ferrand 1840', category: 'Brandy', price: 38, twoWeeksAgoPrice: 36, history: [34, 34, 35, 35, 36, 38] },
    { id: 'asbach-uralt', name: 'Asbach Uralt', category: 'Brandy', price: 28, twoWeeksAgoPrice: 29, history: [30, 30, 29, 29, 29, 28] },
    { id: 'torres-10', name: 'Torres 10', category: 'Brandy', price: 24, twoWeeksAgoPrice: 23, history: [21, 22, 22, 23, 23, 24] },
  ];

  function pctChange(current, prev) {
    return ((current - prev) / prev) * 100;
  }

  function fmtUsd(n) {
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: n < 100 ? 2 : 0 });
  }

  function fmtKrw(n) {
    return '₩' + Math.round(n * USD_KRW_RATE).toLocaleString('ko-KR');
  }

  function renderMarketOverview() {
    const overview = document.getElementById('overview');
    const changes = brandyData.map((b) => pctChange(b.price, b.twoWeeksAgoPrice));
    const avgChange = changes.reduce((a, c) => a + c, 0) / changes.length;
    const upCount = changes.filter((c) => c > 0).length;
    const downCount = changes.filter((c) => c < 0).length;

    overview.innerHTML = `
      <div class="stat">
        <div class="label">추적 품목</div>
        <div class="value">${brandyData.length}</div>
      </div>
      <div class="stat">
        <div class="label">평균 변동률</div>
        <div class="value ${avgChange >= 0 ? 'up' : 'down'}">${avgChange >= 0 ? '+' : ''}${avgChange.toFixed(2)}%</div>
      </div>
      <div class="stat">
        <div class="label">상승</div>
        <div class="value up">${upCount}</div>
      </div>
      <div class="stat">
        <div class="label">하락</div>
        <div class="value down">${downCount}</div>
      </div>
    `;
  }

  function renderCards() {
    const grid = document.getElementById('grid');
    grid.innerHTML = brandyData.map((b) => {
      const change = pctChange(b.price, b.twoWeeksAgoPrice);
      const dir = change >= 0 ? 'up' : 'down';
      const arrow = change >= 0 ? '▲' : '▼';
      const maxHist = Math.max(...b.history);
      const minHist = Math.min(...b.history);
      const range = maxHist - minHist || 1;
      const bars = b.history.map((h) => {
        const heightPct = 15 + ((h - minHist) / range) * 85;
        return `<div class="bar" style="height:${heightPct}%"></div>`;
      }).join('');

      return `
        <article class="card" data-id="${b.id}">
          <div class="card-top">
            <span class="name">${b.name}</span>
          </div>
          <div class="category">${b.category}</div>
          <div class="price-row">
            <span class="price-usd">${fmtUsd(b.price)}</span>
            <span class="price-krw">${fmtKrw(b.price)}</span>
          </div>
          <span class="change ${dir}">${arrow} ${Math.abs(change).toFixed(2)}%<span class="change-label">2주 대비</span></span>
          <div class="sparkline">${bars}</div>
        </article>
      `;
    }).join('');
  }

  function initTicker() {
    const ticker = document.getElementById('ticker');
    const build = () => brandyData.map((b) => {
      const change = pctChange(b.price, b.twoWeeksAgoPrice);
      const dir = change >= 0 ? 'up' : 'down';
      const arrow = change >= 0 ? '▲' : '▼';
      return `<span class="item"><strong>${b.name}</strong>${fmtUsd(b.price)} <span class="${dir}">${arrow} ${Math.abs(change).toFixed(2)}%</span></span>`;
    }).join('');
    ticker.innerHTML = build() + build();
  }

  function renderUpdatedAt(iso) {
    const el = document.getElementById('updatedAt');
    if (!el) return;
    if (!iso) { el.textContent = ''; return; }
    el.style.color = 'var(--text-muted)';
    el.textContent = '마지막 갱신: ' + new Date(iso).toLocaleString('ko-KR');
  }

  function processData() {
    renderMarketOverview();
    renderCards();
    initTicker();
  }

  async function fetchLiveData() {
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data.items) || data.items.length === 0) return;
      brandyData = data.items;
      renderUpdatedAt(data.updatedAt);
      processData();
    } catch (err) {
      // Keep showing the fallback/last-known data; likely running without the API.
    }
  }

  processData();
  fetchLiveData();
  setInterval(fetchLiveData, POLL_INTERVAL_MS);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
