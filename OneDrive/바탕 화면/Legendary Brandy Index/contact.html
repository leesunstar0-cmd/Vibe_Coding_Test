<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 및 비즈니스 문의</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1234567890123456"
         crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #080808;
            --card-bg: rgba(20, 18, 15, 0.85);
            --card-border: rgba(212, 175, 55, 0.25);
            --accent-gold: #d4af37;
            --accent-gold-grad: linear-gradient(135deg, #f9f0d0 0%, #d4af37 50%, #8a6513 100%);
            --text-main: #f3efe6;
            --text-muted: #958c80;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Noto Serif KR', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.12) 0%, transparent 60%);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .gold-text {
            background: var(--accent-gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .partnership-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            width: 100%;
            max-width: 580px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            margin: 20px 0;
        }

        .header-area { text-align: center; margin-bottom: 30px; }
        .header-area h1 { font-family: var(--font-heading); font-size: 2rem; letter-spacing: 2px; margin-bottom: 8px; }
        .header-area p { color: var(--text-muted); font-size: 0.95rem; font-weight: 300; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.88rem; color: var(--accent-gold); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border); color: var(--text-main);
            border-radius: 8px; outline: none; font-size: 0.95rem; font-family: var(--font-body);
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .submit-btn {
            width: 100%; padding: 14px; background: var(--accent-gold-grad); color: #000;
            border: none; font-weight: 700; font-family: var(--font-heading); font-size: 1rem;
            letter-spacing: 1px; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: opacity 0.3s;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { cursor: not-allowed; opacity: 0.6; }

        .form-status { margin-top: 15px; font-size: 0.9rem; text-align: center; min-height: 24px; }

        .adsense-container {
            width: 100%; max-width: 580px; margin: 15px 0; text-align: center; overflow: hidden;
            border-radius: 12px; background: rgba(15, 13, 10, 0.5); border: 1px dashed rgba(212, 175, 55, 0.15); padding: 10px;
        }
        .adsense-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; display: block; letter-spacing: 1px; }

        @media (max-width: 480px) {
            .partnership-card { padding: 30px 20px; }
            .header-area h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="partnership-card">
        <div class="header-area">
            <a href="index.html" style="display:inline-block;margin-bottom:16px;color:var(--text-muted);font-size:0.85rem;">← 시세 보기로 돌아가기</a>
            <h1 class="gold-text">Partnership Inquiry</h1>
            <p>제휴 및 비즈니스 협력 문의를 남겨주시면 빠르게 연락드리겠습니다.</p>
        </div>

        <form id="partnershipForm" action="https://formspree.io/f/xqpkbdae" method="POST">
            <input type="hidden" name="_subject" value="[신규 제휴 문의] 새로운 비즈니스 제안이 접수되었습니다.">

            <div class="form-group">
                <label for="companyName"><i class="fa-solid fa-building" style="margin-right: 6px;"></i> 회사 / 담당자명</label>
                <input type="text" id="companyName" name="company_or_name" required placeholder="예: (주)브랜드 / 홍길동">
            </div>

            <div class="form-group">
                <label for="userEmail"><i class="fa-solid fa-envelope" style="margin-right: 6px;"></i> 이메일 주소</label>
                <input type="email" id="userEmail" name="email" required placeholder="contact@company.com">
            </div>

            <div class="form-group">
                <label for="userPhone"><i class="fa-solid fa-phone" style="margin-right: 6px;"></i> 연락처 (선택)</label>
                <input type="tel" id="userPhone" name="phone" placeholder="010-1234-5678">
            </div>

            <div class="form-group">
                <label for="inquiryType"><i class="fa-solid fa-handshake" style="margin-right: 6px;"></i> 제휴 유형</label>
                <select id="inquiryType" name="inquiry_type" required>
                    <option value="" disabled selected>유형을 선택해 주세요</option>
                    <option value="마케팅/프로모션">마케팅 / 프로모션 제휴</option>
                    <option value="입점/유통">입점 / 유통 문의</option>
                    <option value="콘텐츠/컬래버레이션">콘텐츠 / 컬래버레이션</option>
                    <option value="기타 문의">기타 비즈니스 문의</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userMessage"><i class="fa-solid fa-pen" style="margin-right: 6px;"></i> 제휴 제안 내용</label>
                <textarea id="userMessage" name="message" rows="5" required placeholder="제안하고자 하는 내용을 상세히 작성해 주세요."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">문의 보내기</button>
            <div id="formStatus" class="form-status"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('partnershipForm');
        const formStatus = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = '전송 중...';
            formStatus.innerText = '';

            const data = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    formStatus.style.color = '#22c55e';
                    formStatus.innerText = '✓ 성공적으로 접수되었습니다. 빠른 시일 내에 답변드리겠습니다!';
                    form.reset();
                } else {
                    const result = await response.json();
                    formStatus.style.color = '#ff4d4d';
                    if (Object.hasOwn(result, 'errors')) {
                        formStatus.innerText = result["errors"].map(error => error["message"]).join(", ");
                    } else {
                        formStatus.innerText = '✕ 전송 중 오류가 발생했습니다. 다시 시도해 주세요.';
                    }
                }
            } catch (error) {
                formStatus.style.color = '#ff4d4d';
                formStatus.innerText = '✕ 네트워크 오류가 발생했습니다.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '문의 보내기';
            }
        });
    </script>
</body>
</html>
